<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>yoinks · 网页版</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1a1d21;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #7c3aed;
    --accent-dark: #6d28d9;
    --accent-soft: #f3effe;
    --success: #16a34a;
    --danger: #dc2626;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #2a2e38;
      --accent: #a78bfa;
      --accent-dark: #8b5cf6;
      --accent-soft: #2a2140;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 18px 60px; }
  header { text-align: center; margin-bottom: 26px; }
  header .logo {
    display: inline-flex; align-items: center; justify-content: center;
    width: 56px; height: 56px; border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), #ec4899);
    color: #fff; font-size: 30px; font-weight: 800;
    box-shadow: 0 6px 20px rgba(124, 58, 237, .35);
  }
  header h1 { font-size: 26px; margin: 12px 0 6px; letter-spacing: 1px; }
  header p { color: var(--muted); font-size: 14px; margin: 0; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 10px rgba(0,0,0,.04);
  }
  .step-label { font-size: 13px; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
  .step-label b {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    font-size: 12px; margin-right: 6px;
  }
  .url-row { display: flex; gap: 10px; }
  input[type="url"] {
    flex: 1; min-width: 0;
    padding: 13px 14px;
    font-size: 16px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  input[type="url"]:focus { border-color: var(--accent); }
  button {
    font-family: inherit;
    border: none; border-radius: 10px;
    font-size: 16px; font-weight: 700;
    cursor: pointer;
  }
  .btn-primary {
    background: var(--accent); color: #fff;
    padding: 13px 22px; white-space: nowrap;
    transition: background .15s;
  }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:disabled { opacity: .55; cursor: not-allowed; }
  .btn-block { width: 100%; padding: 15px; font-size: 17px; margin-top: 4px; }
  .btn-ghost {
    background: transparent; color: var(--muted);
    border: 1.5px solid var(--border);
    padding: 12px 18px; width: 100%; margin-top: 10px;
  }
  .video-card { display: flex; gap: 14px; align-items: flex-start; }
  .video-card img {
    width: 128px; height: 72px; object-fit: cover;
    border-radius: 8px; background: var(--border); flex-shrink: 0;
  }
  .video-card .title { font-weight: 700; font-size: 15px; line-height: 1.45; margin-bottom: 6px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .video-card .meta { font-size: 13px; color: var(--muted); }
  .formats { display: grid; gap: 10px; }
  .format {
    display: flex; align-items: center; gap: 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px; padding: 13px 14px;
    cursor: pointer; font-size: 15px;
    transition: border-color .15s, background .15s;
    user-select: none;
  }
  .format .radio {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--border); flex-shrink: 0;
    position: relative; transition: border-color .15s;
  }
  .format.selected { border-color: var(--accent); background: var(--accent-soft); }
  .format.selected .radio { border-color: var(--accent); }
  .format.selected .radio::after {
    content: ""; position: absolute; inset: 3px;
    border-radius: 50%; background: var(--accent);
  }
  .format .kind {
    margin-left: auto; font-size: 12px; color: var(--muted);
    background: var(--bg); border: 1px solid var(--border);
    padding: 3px 9px; border-radius: 20px; flex-shrink: 0;
  }
  .progress-track {
    height: 12px; border-radius: 8px;
    background: var(--border); overflow: hidden; margin: 14px 0 10px;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), #ec4899);
    border-radius: 8px; transition: width .25s;
  }
  .progress-info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .progress-info b { color: var(--text); font-size: 20px; }
  .status-line { text-align: center; font-size: 14px; color: var(--muted); margin-top: 12px; min-height: 20px; }
  .done-box { text-align: center; padding: 8px 0; }
  .done-box .check {
    width: 52px; height: 52px; border-radius: 50%;
    background: #dcfce7; color: var(--success);
    font-size: 28px; display: inline-flex;
    align-items: center; justify-content: center; margin-bottom: 10px;
  }
  .done-box .path {
    font-size: 13px; color: var(--muted); word-break: break-all;
    background: var(--bg); border-radius: 8px; padding: 10px 12px; margin-top: 10px;
  }
  .error-box {
    background: #fef2f2; border: 1px solid #fecaca; color: var(--danger);
    border-radius: 10px; padding: 12px 14px; font-size: 14px; margin-bottom: 16px;
  }
  @media (prefers-color-scheme: dark) {
    .error-box { background: #3a1d1d; border-color: #7f2d2d; }
    .done-box .check { background: #14532d; }
  }
  .spinner {
    display: inline-block; width: 18px; height: 18px; vertical-align: -3px;
    border: 2.5px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 26px; }
</style>
</head>
<body>
<div class="wrap">
  <!-- 登录 -->
  <div id="loginView" class="hidden" style="max-width:380px;margin:60px auto 0">
    <header>
      <div class="logo">Y</div>
      <h1>yoinks</h1>
      <p>这个站点设了访问密码</p>
    </header>
    <div class="card">
      <div class="step-label"><b>🔒</b>请输入访问密码</div>
      <div class="url-row">
        <input type="password" id="passwordInput" placeholder="访问密码" autocomplete="off" style="flex:1;min-width:0;padding:13px 14px;font-size:16px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);outline:none">
        <button class="btn-primary" id="loginBtn">进入</button>
      </div>
    </div>
  </div>

  <div id="mainView" class="hidden">
  <header>
    <div class="logo">Y</div>
    <h1>yoinks</h1>
    <p>粘贴链接，选清晰度，一键下载 · 无广告</p>
  </header>

  <div id="errorBox" class="error-box hidden"></div>

  <!-- 步骤 1：粘贴链接 -->
  <div class="card" id="step1">
    <div class="step-label"><b>1</b>粘贴视频链接</div>
    <div class="url-row">
      <input type="url" id="urlInput" placeholder="https://…（支持 B站、抖音、YouTube 等 1800+ 网站）" autocomplete="off">
      <button class="btn-primary" id="probeBtn">解析</button>
    </div>
  </div>

  <!-- 步骤 2：视频信息 + 选清晰度 -->
  <div class="card hidden" id="step2">
    <div class="step-label"><b>2</b>选择清晰度</div>
    <div class="video-card" style="margin-bottom:14px">
      <img id="thumb" alt="">
      <div>
        <div class="title" id="videoTitle"></div>
        <div class="meta" id="videoMeta"></div>
      </div>
    </div>
    <div class="formats" id="formatList"></div>
  </div>

  <!-- 步骤 3：下载 -->
  <div class="card hidden" id="step3">
    <div class="step-label"><b>3</b>下载</div>
    <div id="downloadIdle">
      <button class="btn-primary btn-block" id="downloadBtn">开始下载</button>
    </div>
    <div id="downloadActive" class="hidden">
      <div class="progress-info"><b id="percentText">0%</b><span id="sizeText"></span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-info"><span id="speedText"></span><span id="etaText"></span></div>
      <div class="status-line" id="statusLine"></div>
      <button class="btn-ghost" id="cancelBtn">取消下载</button>
    </div>
    <div id="downloadDone" class="hidden">
      <div class="done-box">
        <div class="check">✓</div>
        <div style="font-weight:700;font-size:17px">下载完成</div>
        <div class="path" id="donePath"></div>
        <a id="fileDownloadBtn" href="#" style="text-decoration:none"><button class="btn-primary btn-block" style="margin-top:12px">下载文件到手机 / 电脑</button></a>
        <button class="btn-ghost" id="againBtn">再下一个</button>
      </div>
    </div>
  </div>

  <footer>文件保存到你电脑的「下载」文件夹 · 仅下载你有权保存的内容</footer>
  </div><!-- /mainView -->
</div>

<script>
const $ = id => document.getElementById(id);
const urlInput = $('urlInput'), probeBtn = $('probeBtn');
const step2 = $('step2'), step3 = $('step3'), errorBox = $('errorBox');
const loginView = $('loginView'), mainView = $('mainView');
let probeData = null, selectedIndex = 0, abortController = null;

// ---- 登录状态 ----
async function checkAuth() {
  try {
    const res = await fetch('/api/me');
    const data = await res.json();
    if (data.authRequired && !data.authed) {
      loginView.classList.remove('hidden');
      mainView.classList.add('hidden');
    } else {
      loginView.classList.add('hidden');
      mainView.classList.remove('hidden');
    }
  } catch {
    mainView.classList.remove('hidden');
  }
}
function requireLogin() {
  loginView.classList.remove('hidden');
  mainView.classList.add('hidden');
  $('passwordInput').focus();
}
$('loginBtn').addEventListener('click', doLogin);
$('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
async function doLogin() {
  const password = $('passwordInput').value;
  const btn = $('loginBtn');
  btn.disabled = true; btn.textContent = '验证中…';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password}),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.message || '登录失败');
    loginView.classList.add('hidden');
    mainView.classList.remove('hidden');
    $('passwordInput').value = '';
  } catch (e) {
    showError(e.message || '登录失败');
  } finally {
    btn.disabled = false; btn.textContent = '进入';
  }
}
checkAuth();

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.classList.remove('hidden');
  setTimeout(() => errorBox.scrollIntoView({behavior: 'smooth', block: 'center'}), 50);
}
function hideError() { errorBox.classList.add('hidden'); }

function formatDuration(sec) {
  if (!sec || sec <= 0) return '';
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}

// ---- 解析 ----
probeBtn.addEventListener('click', doProbe);
urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') doProbe(); });

async function doProbe() {
  const url = urlInput.value.trim();
  if (!/^https?:\/\//i.test(url)) { showError('请粘贴一个以 http 开头的视频链接'); return; }
  hideError();
  probeBtn.disabled = true;
  probeBtn.innerHTML = '<span class="spinner"></span>解析中';
  step2.classList.add('hidden'); step3.classList.add('hidden');
  try {
    const res = await fetch('/api/probe', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url}),
    });
    if (res.status === 401) { requireLogin(); return; }
    const data = await res.json();
    if (!data.ok) throw new Error(data.message || '解析失败');
    probeData = data;
    renderVideo(data);
    step2.classList.remove('hidden');
    step3.classList.remove('hidden');
    resetDownloadUI();
    step2.scrollIntoView({behavior: 'smooth', block: 'start'});
  } catch (e) {
    showError(e.message || '解析失败，请检查链接后重试');
  } finally {
    probeBtn.disabled = false;
    probeBtn.textContent = '解析';
  }
}

function renderVideo(data) {
  $('videoTitle').textContent = data.title || '未知标题';
  const meta = [data.uploader, formatDuration(data.duration)].filter(Boolean).join(' · ');
  $('videoMeta').textContent = meta;
  const thumb = $('thumb');
  if (data.thumbnail) { thumb.src = data.thumbnail; thumb.style.display = ''; }
  else thumb.style.display = 'none';
  const list = $('formatList');
  list.innerHTML = '';
  selectedIndex = 0;
  data.choices.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'format' + (i === 0 ? ' selected' : '');
    div.innerHTML = `<span class="radio"></span><span></span><span class="kind">${c.kind === 'audio' ? '音频' : '视频'}</span>`;
    div.querySelector('span:nth-child(2)').textContent = c.label;
    div.addEventListener('click', () => {
      selectedIndex = i;
      list.querySelectorAll('.format').forEach((el, j) => el.classList.toggle('selected', j === i));
    });
    list.appendChild(div);
  });
}

// ---- 下载（SSE） ----
function resetDownloadUI() {
  $('downloadIdle').classList.remove('hidden');
  $('downloadActive').classList.add('hidden');
  $('downloadDone').classList.add('hidden');
}

$('downloadBtn').addEventListener('click', startDownload);
$('cancelBtn').addEventListener('click', () => { if (abortController) abortController.abort(); });
$('againBtn').addEventListener('click', () => {
  urlInput.value = ''; urlInput.focus();
  step2.classList.add('hidden'); step3.classList.add('hidden');
  window.scrollTo({top: 0, behavior: 'smooth'});
});

async function startDownload() {
  if (!probeData) return;
  hideError();
  $('downloadIdle').classList.add('hidden');
  $('downloadActive').classList.remove('hidden');
  $('downloadDone').classList.add('hidden');
  setProgress(0);
  $('sizeText').textContent = ''; $('speedText').textContent = ''; $('etaText').textContent = '';
  $('statusLine').innerHTML = '<span class="spinner"></span>正在开始下载…';

  abortController = new AbortController();
  try {
    const res = await fetch('/api/download', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        url: urlInput.value.trim(),
        choiceIndex: selectedIndex,
        infoJsonPath: probeData.infoJsonPath,
      }),
      signal: abortController.signal,
    });
    if (res.status === 401) { requireLogin(); resetDownloadUI(); return; }
    if (!res.ok || !res.body) throw new Error('下载请求失败');
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const parts = buffer.split('\n\n');
      buffer = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (line.startsWith('data:')) handleEvent(JSON.parse(line.slice(5)));
      }
    }
  } catch (e) {
    if (e.name === 'AbortError') {
      showError('已取消下载');
    } else {
      showError(e.message || '下载失败，请重试');
    }
    resetDownloadUI();
  }
}

function setProgress(p) {
  $('progressFill').style.width = Math.min(100, p) + '%';
  $('percentText').textContent = (Math.round(p * 10) / 10) + '%';
}

function handleEvent(ev) {
  if (ev.type === 'progress') {
    if (ev.percent !== undefined) setProgress(ev.percent);
    $('sizeText').textContent = ev.total ? `${ev.downloaded} / ${ev.total}` : (ev.downloaded || '');
    $('speedText').textContent = ev.speed ? `速度 ${ev.speed}` : '';
    $('etaText').textContent = ev.eta ? `剩余 ${ev.eta}` : '';
    const partInfo = ev.totalParts > 1 ? `（第 ${ev.part + 1}/${ev.totalParts} 部分）` : '';
    $('statusLine').textContent = '下载中…' + partInfo;
  } else if (ev.type === 'processing') {
    $('statusLine').innerHTML = '<span class="spinner"></span>正在合并/转码，请稍候…';
  } else if (ev.type === 'done') {
    setProgress(100);
    $('downloadActive').classList.add('hidden');
    $('downloadDone').classList.remove('hidden');
    $('donePath').textContent = '已保存到：' + ev.filepath;
    if (ev.fileToken) {
      const a = $('fileDownloadBtn');
      a.href = '/api/file?id=' + encodeURIComponent(ev.fileToken);
      a.style.display = '';
    } else {
      $('fileDownloadBtn').style.display = 'none';
    }
  } else if (ev.type === 'error') {
    showError(ev.message || '下载失败');
    resetDownloadUI();
  }
}
</script>
</body>
</html>
